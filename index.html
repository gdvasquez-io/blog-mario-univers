<article id="post-2" class="noscript-post">

            <span class="tag">Opinion Essay</span>
            <h2>2. Our Opinion: Who is the best character in Super Mario?</h2>
          </div>
          <div class="noscript-post-body">
            <p>In our opinion, the Super Mario universe has many great characters, but we think Shy Guy, Wario, and

Luigi are the best. Every character is special and good for different players.</p>
            <p>First, Daniel prefers Shy Guy because he is very mysterious and cool. He wears a classic mask and has
              many colors. In games like Mario Kart, Shy Guy is very fast and fun to play with.</p>
            <p>Second, Marc likes Wario. Wario is the greedy rival of Mario and one of the most unique characters in
              the franchise. He is strong, funny, and surprisingly fast. We think he is the most entertaining character in the games.</p>
            <p>Finally, Josep thinks Luigi is the best. Luigi can jump very high, and he is a bit different from his
              brother. He is sometimes scared, but he is very brave in games like Luigi's Mansion. We think he is a very
              fun character.</p>
            <p>In conclusion, all characters are amazing. But for us, Shy Guy, Wario, and Luigi make the games perfect.
              What is your favorite character?</p>
          </div>
        </article>

<article id="post-3" class="noscript-post">
          <div class="noscript-post-header">
            <span class="tag">Students' Choice</span>
            <h2>3. Our Favorite Super Mario Games</h2>
          </div>
          <div class="noscript-post-body">
            <p>The Super Mario franchise has many incredible games. We played many of them, and today we want to talk
              about our three favorite titles.</p>
            <p>First, Daniel loves Super Mario Odyssey. This game is for the Nintendo Switch, and it is beautiful. In
              this adventure, Mario has a special hat called Cappy. With this hat, Mario can control enemies like
              Goombas or a big T-Rex. Daniel thinks the open worlds are amazing and very fun to explore.</p>
            <p>Second, Marc prefers Mario Strikers. This is the best sports game for him. It combines football with the
              chaos of Mario universe power-ups. Marc loves the fast-paced matches and the competitive online mode. It is a perfect game
              to play with friends at home because it is very intense and fun.</p>
            <p>Finally, Josep chooses Super Mario Galaxy 2. This game is the incredible sequel to the original Galaxy,
              released for the Nintendo Wii. It keeps all the amazing gravity mechanics but adds new power-ups like the Cloud Suit and Yoshi.
              Josep thinks it is even better than the first one, and the level design is absolutely perfect.</p>
            <p>In conclusion, Super Mario games are always high quality. Whether you prefer adventures in space, racing
              with friends, or exploring big worlds, there is always a perfect Mario game for you.</p>
          </div>
        </article>

          </div>
          <div class="noscript-post-body">
            <p>Welcome to our special games post! We created three fun and entertaining activities about the Super Mario
              universe. We edited the images and designs ourselves, and we hope you like them.</p>
            <p><strong>Game 1: Mario Word Search</strong> — Can you find the hidden words? In this classic activity, you
              need to search for the names of your favorite characters, like Mario, Luigi, Yoshi, and Toad. Look
              carefully in all directions!</p>
            <p><strong>Game 2: Find the Differences</strong> — Look at the two pictures of Mario very closely. They look
              identical, but they are not! There are some small differences between them. Can you find all of them?</p>
            <p><strong>Game 3: Mushroom Kingdom Match (Candy Crush Style)</strong> — This is a very addictive puzzle
              game! You need to connect three or more identical icons from the Mario universe, like red mushrooms,
              stars, and coins. Connect them to clear the board and get points!</p>
